name: Card
description: "A card is a content container that displays entry-level information—typically within dashboards, galleries, and catalogs"
links:
  - "https://www.patternfly.org/components/card"
variants:
  default:
    title: Default
  secondary:
    title: Secondary
  compact:
    title: Compact
  large:
    title: Large
  plain:
    title: Plain
slots:
  image:
    title: Image
  title:
    title: Title
  body:
    title: Body
  footer:
    title: Footer
  action:
    title: Action
props:
  type: object
  properties:
    heading_level:
      title: "Heading level"
